    <clipPath id="desktopClip"><rect x="40" y="176" width="1016" height="620" rx="20"/></clipPath>
    <clipPath id="mobileClip"><rect x="1096" y="176" width="304" height="620" rx="28"/></clipPath>
    <symbol id="wallet" viewBox="0 0 24 24"><path d="M4 7V5a2 2 0 0 1 2-2h12M4 7h16v14H6a2 2 0 0 1-2-2V7Zm12 5h4v5h-4v-5Z"/><path d="M17.8 14.5h.1"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
