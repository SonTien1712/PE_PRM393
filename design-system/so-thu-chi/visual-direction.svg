<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title description">
  <title id="title">Sổ Thu Chi — Định hướng giao diện đề xuất</title>
  <desc id="description">Phác thảo dashboard desktop và điện thoại với dữ liệu minh họa, bảng màu và các ưu tiên thiết kế. Chưa phải ảnh ứng dụng đã triển khai.</desc>
  <defs>
