    <symbol id="arrowDown" viewBox="0 0 24 24"><path d="M12 5v14m-6-6 6 6 6-6"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.2 7a7 7 0 0 1 11.6-1L20 9M4 15l2.2 3A7 7 0 0 0 17.8 17"/></symbol>
    <symbol id="food" viewBox="0 0 24 24"><path d="M4 3v6c0 2 6 2 6 0V3M7 3v18M20 21V3c-5 2-5 10 0 10"/></symbol>
    <symbol id="bag" viewBox="0 0 24 24"><path d="M4 8h16l1 13H3L4 8Zm4 0V6a4 4 0 0 1 8 0v2"/></symbol>
    <symbol id="car" viewBox="0 0 24 24"><path d="m4 10 2-6h12l2 6M4 10h16v8H4v-8ZM6 18v3m12-3v3M7 14h1m8 0h1"/></symbol>
