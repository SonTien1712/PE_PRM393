  <path d="M708 852v164" stroke="#DCE7E3"/>
  <text x="740" y="868" class="small bold">CHỮ &amp; KHOẢNG CÁCH</text>
  <text x="740" y="905" font-size="24" font-weight="600">Be Vietnam Pro</text>
  <text x="740" y="931" class="small muted">Font đề xuất khi triển khai · Bundle offline</text>
