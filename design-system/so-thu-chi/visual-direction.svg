    <symbol id="logout" viewBox="0 0 24 24"><path d="M10 3H4v18h6M10 12h11m-4-4 4 4-4 4"/></symbol>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#173B37}
      .muted{fill:#526763}.green{fill:#15805E}.red{fill:#CB3F4F}.white{fill:#fff}
      .icon{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .small{font-size:13px}.body{font-size:15px}.bold{font-weight:600}
    </style>
