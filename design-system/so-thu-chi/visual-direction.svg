  <text x="40" y="84" font-size="30" font-weight="700">Tổng quan rõ ràng, thao tác thuận tiện.</text>
  <text x="40" y="113" font-size="16" class="muted">Ưu tiên số dư · Danh mục dễ nhận biết · Biểu mẫu có hành động rõ ràng</text>
  <rect x="1163" y="34" width="237" height="32" rx="16" fill="#FFFFFF" stroke="#DCE7E3"/>
